[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "internmatch"
version = "0.1.0"
description = "Rate your resume and find the internships you're most likely to get interviews for."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
    "anthropic>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
internmatch = "internmatch.__main__:main"

[tool.setuptools]
packages = ["internmatch"]

[tool.setuptools.package-data]
internmatch = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
